<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AionUi Pet — Interactive Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #1a1b2e;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
    cursor: default;
  }
  /* 状态日志 */
  #log {
    position: fixed; top: 16px; left: 16px;
    font-size: 11px; opacity: 0.5; letter-spacing: 1px;
    max-height: 50vh; overflow-y: auto; line-height: 1.6;
    pointer-events: none; z-index: 10;
  }
  #log .entry { opacity: 0.7; }
  #log .entry:last-child { opacity: 1; }
  /* 操作说明 */
  #help {
    position: fixed; bottom: 16px; left: 16px;
    font-size: 11px; opacity: 0.35; letter-spacing: 1px; line-height: 1.8;
    pointer-events: none;
  }
  /* 模拟按钮 */
  #buttons {
    position: fixed; top: 16px; right: 16px;
    display: flex; flex-direction: column; gap: 6px; z-index: 10;
  }
  #buttons button {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    transition: background 0.15s;
  }
  #buttons button:hover { background: rgba(255,255,255,0.18); }
  /* 宠物容器 */
  #pet {
    position: fixed;
    width: 120px; height: 120px;
    cursor: grab;
    z-index: 100;
    transition: transform 0.15s ease-out;
    user-select: none;
  }
  #pet.dragging { cursor: grabbing; transition: none; }
  #pet svg { width: 100%; height: 100%; }
  /* 状态标签 */
  #state-label {
    position: fixed;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    opacity: 0.4; text-align: center; pointer-events: none;
    z-index: 101;
  }
</style>
</head>
<body>

<div id="log"></div>

<div id="help">
  拖拽 → 移动宠物<br>
  单击 → 开心反应<br>
  连续点击(3+) → 恼怒抖动<br>
  20秒不动鼠标 → 打盹<br>
  60秒不动 → 深度睡眠<br>
  移动鼠标 → 自动唤醒<br>
  右侧按钮 → 模拟各状态
</div>

<div id="buttons">
  <button onclick="triggerState('thinking')">🧠 thinking</button>
  <button onclick="triggerState('working')">💻 working</button>
  <button onclick="triggerState('happy')">😊 happy</button>
  <button onclick="triggerState('error')">❌ error</button>
  <button onclick="triggerState('notification')">❗ notification</button>
  <button onclick="triggerState('sweeping')">🧹 sweeping</button>
  <button onclick="triggerState('building')">🔧 building</button>
  <button onclick="triggerState('juggling')">🤹 juggling</button>
</div>

<div id="pet"></div>
<div id="state-label"></div>

// ═══════════════════════════════════════════════════════════
// STATE MACHINE — 优先级 + 最短显示时间 + 自动回 idle
// ═══════════════════════════════════════════════════════════
const PRIORITY = {
  error: 8, notification: 7, sweeping: 6, happy: 5,
  juggling: 4, building: 4, working: 3, thinking: 2,
  waking: 2, idle: 1, sleeping: 0,
};
const MIN_DISPLAY = {
  happy: 4000, error: 5000, notification: 3000, sweeping: 5500,
  building: 4000, juggling: 4000, waking: 5000, working: 1000, thinking: 1000,
};
const AUTO_RETURN = {
  happy: 4000, error: 5000, notification: 3500, sweeping: 5500,
  building: 5000, juggling: 5000, waking: 5000,
};

let currentState = 'idle';
let stateChangedAt = Date.now();
let pendingState = null;
let pendingTimer = null;
let autoReturnTimer = null;

const petEl = document.getElementById('pet');
const labelEl = document.getElementById('state-label');
const logEl = document.getElementById('log');

function log(msg) {
  const entry = document.createElement('div');
  entry.className = 'entry';
  const t = new Date().toLocaleTimeString('en', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  entry.textContent = `${t}  ${msg}`;
  logEl.appendChild(entry);
  if (logEl.children.length > 30) logEl.firstChild.remove();
  logEl.scrollTop = logEl.scrollHeight;
}

function applyState(state) {
  currentState = state;
  stateChangedAt = Date.now();
  petEl.innerHTML = SVGS[state] || SVGS.idle;
  labelEl.textContent = state;
  const r = petEl.getBoundingClientRect();
  labelEl.style.left = r.left + 'px';
  labelEl.style.top = (r.bottom + 4) + 'px';
  labelEl.style.width = r.width + 'px';

  // Auto-return to idle
  if (autoReturnTimer) clearTimeout(autoReturnTimer);
  const ar = AUTO_RETURN[state];
  if (ar) {
    autoReturnTimer = setTimeout(() => {
      log(`${state} → idle (auto)`);
      applyState('idle');
    }, ar);
  }
}

function setState(newState) {
  const newPri = PRIORITY[newState] ?? 1;
  const curPri = PRIORITY[currentState] ?? 1;

  // 低优先级不打断高优先级
  if (newPri < curPri) {
    log(`⏳ ${newState} queued (${currentState} has higher priority)`);
    return;
  }

  // 检查最短显示时间
  const minMs = MIN_DISPLAY[currentState] || 0;
  const elapsed = Date.now() - stateChangedAt;
  const remaining = minMs - elapsed;

  if (remaining > 0 && newPri <= curPri) {
    if (pendingTimer) clearTimeout(pendingTimer);
    pendingState = newState;
    pendingTimer = setTimeout(() => {
      log(`⏩ ${pendingState} (queued, now playing)`);
      applyState(pendingState);
      pendingState = null;
      pendingTimer = null;
    }, remaining);
    log(`⏳ ${newState} queued (${remaining}ms remaining)`);
    return;
  }

  log(`▶ ${newState}`);
  if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
  applyState(newState);
}

function triggerState(s) { setState(s); }

// ═══════════════════════════════════════════════════════════
// DRAG — 拖拽宠物
// ═══════════════════════════════════════════════════════════
let isDragging = false;
let dragStartX, dragStartY, petStartX, petStartY;
let didDrag = false;

// 初始位置：右下角
let petX = window.innerWidth - 160;
let petY = window.innerHeight - 160;
petEl.style.left = petX + 'px';
petEl.style.top = petY + 'px';

petEl.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  isDragging = true;
  didDrag = false;
  petEl.setPointerCapture(e.pointerId);
  petEl.classList.add('dragging');
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  petStartX = petX;
  petStartY = petY;
});

document.addEventListener('pointermove', (e) => {
  // 更新鼠标活动时间（用于睡眠检测）
  lastMouseMove = Date.now();

  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
  petX = petStartX + dx;
  petY = petStartY + dy;
  petEl.style.left = petX + 'px';
  petEl.style.top = petY + 'px';
  // 更新标签位置
  labelEl.style.left = petX + 'px';
  labelEl.style.top = (petY + 124) + 'px';
});

document.addEventListener('pointerup', () => {
  if (!isDragging) return;
  isDragging = false;
  petEl.classList.remove('dragging');
});

// ═══════════════════════════════════════════════════════════
// CLICK — 单击开心，连点恼怒
// ═══════════════════════════════════════════════════════════
let clickCount = 0;
let clickTimer = null;
const CLICK_WINDOW = 500;

petEl.addEventListener('click', (e) => {
  if (didDrag) return; // 拖拽不算点击

  clickCount++;
  if (clickTimer) clearTimeout(clickTimer);

  clickTimer = setTimeout(() => {
    if (clickCount >= 3) {
      log('🤯 annoyed! (multi-click)');
      setState('error');
    } else {
      log('😊 poked! (click)');
      setState('happy');
    }
    clickCount = 0;
    clickTimer = null;
  }, CLICK_WINDOW);
});

// ═══════════════════════════════════════════════════════════
// SLEEP — 鼠标不动自动睡觉 + 移动唤醒
// ═══════════════════════════════════════════════════════════
let lastMouseMove = Date.now();
const DOZE_TIMEOUT = 20000;    // 20s → sleeping
const DEEP_SLEEP_TIMEOUT = 60000; // 60s → deep sleep (same anim, log different)
let sleepPhase = 'awake'; // awake | dozing | deep

setInterval(() => {
  const idle = Date.now() - lastMouseMove;
  const isInteractive = ['working', 'thinking', 'error', 'notification', 'happy',
                          'sweeping', 'building', 'juggling', 'waking'].includes(currentState);

  if (isInteractive) {
    sleepPhase = 'awake';
    return;
  }

  if (sleepPhase === 'awake' && idle >= DOZE_TIMEOUT) {
    sleepPhase = 'dozing';
    log('💤 dozing off (20s idle)');
    setState('sleeping');
  }

  if (sleepPhase === 'dozing' && idle >= DEEP_SLEEP_TIMEOUT) {
    sleepPhase = 'deep';
    log('😴 deep sleep (60s idle)');
  }
}, 1000);

// 鼠标移动唤醒
document.addEventListener('mousemove', () => {
  if (sleepPhase !== 'awake' && currentState === 'sleeping') {
    sleepPhase = 'awake';
    log('☀️ waking up!');
    setState('waking');
  }
  lastMouseMove = Date.now();
});

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
applyState('idle');
log('🐾 Pet initialized — drag me, click me, or leave me alone!');
</script>
